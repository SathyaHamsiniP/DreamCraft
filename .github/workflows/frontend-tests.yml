name: React studio tests

on:
  push:
    branches: [main, feature/react-studio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            game/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix game
          npm ci --prefix frontend
      - name: Check backend integration
        run: python -m pytest backend/tests contracts/tests playability/tests -q
      - name: Test and build studio
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test full studio workflow
        working-directory: frontend
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-browser-results
          path: frontend/test-results/
          retention-days: 7
