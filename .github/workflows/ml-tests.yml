name: ML tests

on:
  push:
    branches: [main, feature/ml-pipeline, feature/sketch-detection-data-tools]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r sketch/requirements.txt
      - name: Run ML tests
        run: python -m pytest ml/tests sketch/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Test collection interface in Chromium
        working-directory: game
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:collection
