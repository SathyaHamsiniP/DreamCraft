<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>DreamCraft game</title></head>
<body><h1>DreamCraft</h1><p>A/D or arrows: move. Space/W/up: jump. Enter: start. R: restart.</p>
