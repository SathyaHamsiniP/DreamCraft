seed: 42
device: cpu
threads: 2
data: ml/data/synthetic/metadata.csv
output: ml/runs/default
preprocessing:
  size: 64
  threshold: true
model:
  channels: [16, 32, 64]
  hidden: 64
  dropout: 0.2
split:
  val_fraction: 0.2
  test_fraction: 0.2
  group_by: sheet_id
training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  min_delta: 0.0001
  augment: true
